apply plugin: 'com.android.application'

android {
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.moko.tofsensortest"
        minSdkVersion 18
        targetSdkVersion 31
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    viewBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def formatDate = new Date().format("yyyyMMddHHmm")
                def apkFileName = "ToFSensorTest_${defaultConfig.versionName}_${formatDate}.apk"
                if (outputFile.name.contains('debug')) {
                    apkFileName = "ToFSensorTest_${defaultConfig.versionName}_${formatDate}_debug.apk"
                }
                outputFileName = apkFileName
            }
        }
    }
}

dependencies {
//    implementation files('libs\\jxl.jar')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'
    implementation 'com.github.GrenderG:Toasty:1.4.1'
    implementation project(path: ':mokosupport')

    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
}
